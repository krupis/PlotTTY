name: Build release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            package: windows
          - os: ubuntu-22.04
            artifact: linux-x64
            package: linux
          - os: macos-15-intel
            artifact: macos-x64
            package: macos
          - os: macos-15
            artifact: macos-arm64
            package: macos

    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_NAME: PlotTTY-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_number) }}-${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyInstaller==6.22.3

      - name: Check release version
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          tag=os.environ['GITHUB_REF_NAME'];
          assert os.environ['GITHUB_REF_TYPE'] != 'tag' or tag == version, f'Tag {tag} does not match project version {version}'"

      - name: Generate Qt resources
        run: pyside6-rcc resources.qrc -o rc_resources.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller PlotTTY.spec

      - name: Package Windows
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PlotTTY/PlotTTY.exe")) { throw "PlotTTY.exe was not built" }
          New-Item -ItemType Directory -Force "release-stage/PlotTTY", "release" | Out-Null
          Copy-Item "dist/PlotTTY/*" "release-stage/PlotTTY" -Recurse
          Copy-Item "LICENSE", "THIRD_PARTY_NOTICES.txt" "release-stage/PlotTTY"
          $archive = "release/$env:RELEASE_NAME.zip"
          Compress-Archive -Path "release-stage/PlotTTY" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -NoNewline "$archive.sha256"

      - name: Package Linux
        if: matrix.package == 'linux'
        shell: bash
        run: |
          test -x dist/PlotTTY/PlotTTY
          mkdir -p release-stage/PlotTTY release
          cp -a dist/PlotTTY/. release-stage/PlotTTY/
          cp LICENSE THIRD_PARTY_NOTICES.txt release-stage/PlotTTY/
          tar -C release-stage -czf "release/$RELEASE_NAME.tar.gz" PlotTTY
          cd release
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.tar.gz.sha256"

      - name: Package macOS
        if: matrix.package == 'macos'
        shell: bash
        run: |
          test -d dist/PlotTTY.app
          mkdir -p release-stage/PlotTTY release
          cp -R dist/PlotTTY.app release-stage/PlotTTY/
          cp LICENSE THIRD_PARTY_NOTICES.txt release-stage/PlotTTY/
          ditto -c -k --sequesterRsrc --keepParent release-stage/PlotTTY "release/$RELEASE_NAME.zip"
          cd release
          shasum -a 256 "$RELEASE_NAME.zip" > "$RELEASE_NAME.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "PlotTTY $GITHUB_REF_NAME"
          fi
