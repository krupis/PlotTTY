<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030">
<defs>
<style>text{font:14px 'Segoe UI',Arial,sans-serif;fill:#e4e8ed}.title{font-size:23px;font-weight:600}.muted{fill:#9caab7}.small{font-size:12px}.button{fill:#303941;stroke:#46515b}.line{stroke:#39434c}.green{fill:#7cd1a8}</style>
</defs>
<rect width="1280" height="1030" fill="#14191e"/>
<text x="28" y="35" class="title">A · One shared toolbar</text>
<text x="28" y="62" class="muted">Recommended: connection on the left, plot controls on the right, all on the same baseline.</text>
<rect x="28" y="83" width="1224" height="365" rx="6" fill="#242a30" stroke="#46515b"/>
<text x="44" y="108" class="small muted">File     View</text><path d="M28 121H1252" class="line"/>
<rect x="44" y="134" width="158" height="34" rx="4" class="button"/><text x="58" y="156">COM3 · 115200</text>
<text x="218" y="156" class="small muted">● Disconnected</text><rect x="326" y="134" width="85" height="34" rx="4" class="button"/><text x="341" y="156">Connect</text>
<text x="837" y="156" class="small muted">Live capture</text><rect x="943" y="134" width="119" height="34" rx="4" class="button"/><text x="965" y="156">Fit capture</text><rect x="1070" y="134" width="166" height="34" rx="4" fill="#33594b" stroke="#7cd1a8"/><text x="1108" y="156">Auto scroll</text>
<path d="M28 181H1252 M234 193V418" class="line"/>
<text x="44" y="209" class="small muted">SERIES</text><text x="44" y="242" class="small muted">Waiting for series</text><rect x="44" y="379" width="175" height="29" rx="4" class="button"/><text x="94" y="399" class="small">Edit rules…</text>
<rect x="246" y="193" width="990" height="118" rx="3" fill="#1f252b"/><text x="677" y="254" class="small muted">Waiting for series</text><text x="268" y="299" class="small muted">0 s</text><text x="719" y="299" class="small muted">5 s</text><text x="1190" y="299" class="small muted">10 s</text>
<rect x="246" y="321" width="990" height="29" rx="3" fill="#2a323b"/><text x="260" y="341" class="small">⌄ Console</text><text x="1139" y="341" class="small muted">Clear console</text><rect x="246" y="351" width="990" height="32" fill="#1b2026"/>
<rect x="246" y="388" width="912" height="26" rx="3" fill="#1f252b" stroke="#414b55"/><text x="258" y="406" class="small muted">Type command and press Enter</text><rect x="1165" y="388" width="71" height="26" rx="3" class="button"/><text x="1186" y="406" class="small muted">Send</text>
<path d="M28 427H1252" class="line"/><text x="44" y="442" class="small muted">Not recording</text><text x="1093" y="442" class="small muted">0 B/s · Points: 0</text>
<text x="28" y="476" class="muted">“Live capture” becomes quiet context beside the plot controls. Its separate header strip disappears.</text>
<text x="28" y="499" class="small muted">An opened capture filename uses this same space, shortened with a full-name tooltip. Console header shown as an optional refinement.</text>
<text x="28" y="553" class="title">B · Two deliberate rows</text>
<text x="28" y="580" class="muted">Alternative: keep plot controls local, but align the Series and Capture headers into one consistent row.</text>
<rect x="28" y="600" width="1224" height="365" rx="6" fill="#242a30" stroke="#46515b"/>
<text x="44" y="625" class="small muted">File     View</text><path d="M28 638H1252" class="line"/>
<rect x="44" y="651" width="158" height="34" rx="4" class="button"/><text x="58" y="673">COM3 · 115200</text><text x="218" y="673" class="small muted">● Disconnected</text><rect x="326" y="651" width="85" height="34" rx="4" class="button"/><text x="341" y="673">Connect</text>
<path d="M28 698H1252" class="line"/><text x="44" y="728" class="small muted">SERIES</text><text x="246" y="728">Capture</text><text x="317" y="728" class="small muted">/ Live</text><rect x="943" y="707" width="119" height="32" rx="4" class="button"/><text x="965" y="728">Fit capture</text><rect x="1070" y="707" width="166" height="32" rx="4" fill="#33594b" stroke="#7cd1a8"/><text x="1108" y="728">Auto scroll</text>
<path d="M28 748H1252 M234 710V935" class="line"/><text x="44" y="778" class="small muted">Waiting for series</text><rect x="44" y="896" width="175" height="29" rx="4" class="button"/><text x="94" y="916" class="small">Edit rules…</text>
<rect x="246" y="760" width="990" height="79" rx="3" fill="#1f252b"/><text x="677" y="797" class="small muted">Waiting for series</text><text x="268" y="827" class="small muted">0 s</text><text x="719" y="827" class="small muted">5 s</text><text x="1190" y="827" class="small muted">10 s</text>
<rect x="246" y="849" width="990" height="29" rx="3" fill="#2a323b"/><text x="260" y="869" class="small">⌄ Console</text><text x="1139" y="869" class="small muted">Clear console</text><rect x="246" y="879" width="990" height="20" fill="#1b2026"/>
<rect x="246" y="906" width="912" height="26" rx="3" fill="#1f252b" stroke="#414b55"/><text x="258" y="924" class="small muted">Type command and press Enter</text><rect x="1165" y="906" width="71" height="26" rx="3" class="button"/><text x="1186" y="924" class="small muted">Send</text>
<path d="M28 944H1252" class="line"/><text x="44" y="959" class="small muted">Not recording</text><text x="1093" y="959" class="small muted">0 B/s · Points: 0</text>
<text x="28" y="997" class="muted">Both concepts: consistent button heights, 12–16 px insets, a thin sidebar divider, and a narrower sidebar by default.</text>
<text x="28" y="1020" class="small muted">Design proposals only · Panel heights compressed for comparison · No application changes</text>
</svg>
